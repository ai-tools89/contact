<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Leslie Segura</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #070a0f;
    color: #e2e8f0;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
    overflow-x: hidden;
  }

  /* Ambient glow background */
  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  /* Header */
  .header {
    text-align: center;
  }

  .sentinel-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 1rem;
  }

  .sentinel-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 6px #38bdf8;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #f8fafc;
    margin-bottom: 0.35rem;
  }

  .tagline {
    font-size: 0.875rem;
    color: #64748b;
    font-weight: 400;
    line-height: 1.5;
  }

  /* QR Section */
  .qr-wrapper {
    background: #ffffff;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 0 0 1px rgba(56,189,248,0.15), 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }

  .qr-wrapper::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 21px;
    background: linear-gradient(135deg, rgba(56,189,248,0.3), transparent 50%, rgba(56,189,248,0.1));
    z-index: -1;
  }

  .qr-wrapper img {
    display: block;
    width: 180px;
    height: 180px;
    border-radius: 4px;
  }

  .qr-label {
    text-align: center;
    font-size: 11px;
    color: #475569;
    margin-top: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    color: #e2e8f0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:active {
    transform: scale(0.98);
    background: rgba(255,255,255,0.07);
  }

  .link-btn.primary {
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.25);
    color: #e0f2fe;
  }

  .link-btn .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .link-btn.primary .icon { background: rgba(56,189,248,0.15); }
  .link-btn:not(.primary) .icon { background: rgba(255,255,255,0.06); }

  .link-btn .text {
    flex: 1;
  }

  .link-btn .label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .link-btn .sublabel {
    display: block;
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 1px;
  }

  .link-btn.primary .sublabel { color: #7dd3fc; }

  .link-btn .arrow {
    color: #334155;
    font-size: 0.8rem;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #1e293b;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.05);
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #1e293b;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="sentinel-badge">Logic Sentinel</div>
    <div class="name">Leslie Segura</div>
    <div class="tagline">AI &amp; Automation Repair · Founder</div>
  </div>

  <div style="text-align:center">
    <div class="qr-wrapper">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=https%3A%2F%2Flogicsentinel.co&color=070a0f&bgcolor=ffffff&qzone=1&margin=0"
        alt="Scan to visit Logic Sentinel"
      />
    </div>
    <div class="qr-label">Scan to visit</div>
  </div>

  <div class="links">

    <a href="https://logicsentinel.co" class="link-btn primary">
      <div class="icon">🛡️</div>
      <div class="text">
        <span class="label">Logic Sentinel</span>
        <span class="sublabel">AI &amp; Automation Repair · Book a session</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a href="https://www.linkedin.com/in/vinosegura" class="link-btn">
      <div class="icon">in</div>
      <div class="text">
        <span class="label">LinkedIn</span>
        <span class="sublabel">Connect with me</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a href="mailto:vs@logicsentinel.co" class="link-btn">
      <div class="icon">✉️</div>
      <div class="text">
        <span class="label">Email</span>
        <span class="sublabel">vs@logicsentinel.co</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a href="tel:+16462816822" class="link-btn">
      <div class="icon">📱</div>
      <div class="text">
        <span class="label">Phone</span>
        <span class="sublabel">646 281 6822</span>
      </div>
      <span class="arrow">›</span>
    </a>

  </div>

  <div class="footer">New York · logicsentinel.co</div>

</div>

</body>
</html>
